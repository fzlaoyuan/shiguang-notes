<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>拾光便签</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="titlebar"><div class="wordmark"><span class="brand-icon"><i data-lucide="notebook-pen"></i></span>拾光便签 <span class="brand-sub">留住每一刻灵感</span></div><div class="window-actions"><span class="local-badge"><span></span> 仅保存在本机</span><button data-window="minimize" title="最小化"><i data-lucide="minus"></i></button><button data-window="maximize" title="最大化 / 还原"><i data-lucide="square"></i></button><button data-window="close" title="关闭到托盘" class="close-window"><i data-lucide="x"></i></button></div></header>
<div class="app-shell">
<aside class="sidebar">
  <button class="new-button" id="new-note"><i data-lucide="plus"></i> 新建便签 <kbd>Ctrl N</kbd></button>
  <nav id="main-nav"><button data-view="all" class="nav-item active"><i data-lucide="notebook-text"></i><span>全部便签</span><small id="all-count">0</small></button><button data-view="pinned" class="nav-item"><i data-lucide="pin"></i><span>置顶便签</span><small id="pin-count">0</small></button><button data-view="calendar" class="nav-item"><i data-lucide="calendar-days"></i><span>日历视图</span></button></nav>
  <div class="section-label"><span>我的分组</span><button id="add-folder" title="新建分组"><i data-lucide="plus"></i></button></div><div id="folders"></div>
  <div class="sidebar-bottom"><button class="nav-item" data-view="trash"><i data-lucide="trash-2"></i><span>回收站</span><small id="trash-count">0</small></button><div class="sidebar-divider"></div><button class="nav-item" id="settings-button"><i data-lucide="settings-2"></i><span>设置与备份</span></button><div class="offline-note"><i data-lucide="hard-drive"></i> 离线可用 · 安心记录</div></div>
</aside>
<section class="note-column"><div class="list-heading"><div><h1 id="view-title">全部便签</h1><span id="list-count">共 0 篇记录</span></div><button id="sort-button" title="切换排序"><i data-lucide="arrow-down-wide-narrow"></i></button></div><label class="search-box"><i data-lucide="search"></i><input id="search" placeholder="搜索便签内容…" aria-label="搜索便签"><kbd>Ctrl K</kbd></label><div id="calendar" hidden></div><div class="list-caption"><span id="sort-label">最近编辑</span><span>灵感，随时拾起</span></div><div id="note-list"></div><div class="list-footer">把琐碎的想法，写成生活。</div></section>
<main class="workspace"><div class="editor-top"><div class="breadcrumb"><i data-lucide="folder"></i><span id="breadcrumb">随手记</span><span class="breadcrumb-slash">/</span><span>便签</span></div><div class="note-actions"><span id="save-status"><i data-lucide="check"></i> 已保存到本机</span><button id="pin-note" title="置顶便签"><i data-lucide="pin"></i></button><button id="float-note" title="桌面悬浮便签"><i data-lucide="picture-in-picture-2"></i></button><button id="note-menu" title="更多操作"><i data-lucide="ellipsis"></i></button></div></div>
<div id="toolbar" class="toolbar">
<button data-command="undo" title="撤销 Ctrl+Z"><i data-lucide="undo-2"></i></button><button data-command="redo" title="重做 Ctrl+Shift+Z"><i data-lucide="redo-2"></i></button><span class="separator"></span>
<button data-command="heading" title="二级标题"><i data-lucide="heading-2"></i></button><button data-command="bold" title="加粗 Ctrl+B"><i data-lucide="bold"></i></button><button data-command="italic" title="斜体 Ctrl+I"><i data-lucide="italic"></i></button><button data-command="underline" title="下划线 Ctrl+U"><i data-lucide="underline"></i></button><button data-command="strike" title="删除线"><i data-lucide="strikethrough"></i></button><button data-command="highlight" title="高亮"><i data-lucide="highlighter"></i></button><span class="separator"></span>
<button data-command="taskList" title="待办清单"><i data-lucide="list-todo"></i></button><button data-command="bulletList" title="项目列表"><i data-lucide="list"></i></button><button data-command="orderedList" title="编号列表"><i data-lucide="list-ordered"></i></button><button data-command="blockquote" title="引用"><i data-lucide="quote"></i></button><button data-command="codeBlock" title="代码块"><i data-lucide="code-2"></i></button><span class="separator"></span><button id="add-image" title="插入图片，也可直接粘贴或拖入"><i data-lucide="image-plus"></i></button><button data-command="horizontalRule" title="分隔线"><i data-lucide="minus"></i></button><div class="toolbar-right"><button id="focus-mode" title="专注模式 / Esc 退出"><i data-lucide="scan"></i></button></div>
</div>
<div id="trash-banner" hidden>这篇便签在回收站中 <button id="restore-note">恢复便签</button><button id="delete-note">永久删除</button></div>
<div class="document-scroll" id="document-scroll"><article class="document" id="document"><div class="note-label"><span id="note-color-dot"></span><span id="note-date"></span></div><input id="note-title" placeholder="无标题便签" aria-label="便签标题" maxlength="200"><div class="note-meta"><span id="created-date"></span><span>·</span><select id="note-folder" aria-label="所属分组"></select></div><div id="editor"></div></article><div id="empty-editor" hidden><div class="empty-symbol"><i data-lucide="notebook-pen"></i></div><h2>给灵感留一点空白</h2><p>选择一篇便签，或开始一段新的记录。</p><button id="empty-create" class="primary">新建便签</button></div></div>
<footer class="editor-footer"><span><span class="status-dot"></span> 本地记录</span><div><span id="word-count">0 字</span><span id="image-count">0 张图片</span><span>Ctrl S 保存</span></div></footer>
</main></div>
<div id="popup" class="popup" hidden></div><div id="toast" role="status" hidden></div><input id="image-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
<dialog id="dialog"><form id="dialog-form"><div class="dialog-header"><h2 id="dialog-title"></h2><button type="button" id="dialog-close" title="关闭"><i data-lucide="x"></i></button></div><div id="dialog-body"></div><div id="dialog-footer"></div></form></dialog>
<script src="renderer.js"></script></body></html>
